<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tracker ETF</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels"></script>

<style>
body { padding:20px; }
.container { max-width:600px; }
.card { text-align:center; margin-bottom:20px; }
table { width:100%; }
th,td { text-align:center; white-space:nowrap; }
tr:nth-child(even) td { background:#f2f2f2; }
#portfolio-piechart { max-width:300px; margin:auto; }
</style>
</head>

<body>
<div class="container">
<h1 class="text-center mb-4">Tracker ETF</h1>

<div class="card">
<div class="card-body">
<h5>Valoarea Portofoliului</h5>
<p id="portfolio-value" class="fs-3">Încărcare…</p>
</div>
</div>

<table class="table table-bordered">
<thead>
<tr><th>ETF</th><th>Valoare</th><th>1D</th><th>1W</th><th>1M</th></tr>
</thead>
<tbody id="table1"></tbody>
</table>

<table class="table table-bordered">
<thead>
<tr><th>Dețineri</th><th>Investiție</th><th>Curent</th><th>P/L</th></tr>
</thead>
<tbody id="table2"></tbody>
</table>

<canvas id="portfolio-piechart"></canvas>
</div>

<script>
const apiKey = "fNcLEuhsYv6v44skcJnK2adnZSlA15HhJVgfZa6d";

const etfs = [
 { symbol:"ASWC.DE",    qty:485, buy:14.3331, currency:"EUR", yahoo:true },
 { symbol:"VWCE.DE",    qty:41,  buy:131.2480, currency:"EUR", yahoo:true },
 { symbol:"XDWI.DE",    qty:37,  buy:67.5516,  currency:"EUR", yahoo:true },

 // ETF BET Patria Tradeville on BVB in RON  
 { symbol:"TVBETETF.RO", qty:610, buy:40.9142, currency:"RON", yahoo:true }
];

const names = {
 "ASWC.DE":"NATO",
 "VUAA.DE":"S&P500",
 "VWCE.DE":"WORLD",
 "XDWI.DE":"EM",
 "TVBETETF.RO":"BET"
};

const fmt = v => v.toLocaleString("en-US",{minimumFractionDigits:2});

async function fetchYahoo(symbol){
 const response = await fetch(
  `https://yfapi.net/v8/finance/spark?symbols=${symbol}&range=1mo&interval=1d`,
  { headers: { "x-api-key": apiKey } }
 );
 return response.json();
}

async function fetchRONtoEUR(){
 try {
  const r = await fetch("https://api.frankfurter.app/latest?from=RON&to=EUR");
  const d = await r.json();
  return d.rates.EUR;
 } catch {
  return 0.20;
 }
}

async function updatePortfolio(){
 const ronToEur = await fetchRONtoEUR();

 let total = 0;
 let labels = [];
 let dataPie = [];

 document.getElementById("table1").innerHTML = "";
 document.getElementById("table2").innerHTML = "";

 for(const e of etfs){
  try {
   const data = await fetchYahoo(e.symbol);
   const prices = data[e.symbol]?.close;
   if(!prices) continue;

   let current = prices.at(-1);
   let prevDay = prices.at(-2);
   let prevWeek = prices.at(-6);
   let first = prices[0];

   let fx = e.currency==="RON" ? ronToEur : 1;

   current *= fx;
   prevDay *= fx;
   prevWeek *= fx;
   first *= fx;

   const day = ((current - prevDay)/prevDay)*100;
   const week = ((current - prevWeek)/prevWeek)*100;
   const month = ((current - first)/first)*100;

   const invested = e.qty * e.buy * fx;
   const value = e.qty * current;
   const pl = value - invested;

   total += value;

   document.getElementById("table1").innerHTML += `
    <tr>
     <td>${names[e.symbol]}</td>
     <td>${fmt(current)}</td>
     <td class="${day>=0?'text-success':'text-danger'}">${day.toFixed(2)}%</td>
     <td class="${week>=0?'text-success':'text-danger'}">${week.toFixed(2)}%</td>
     <td class="${month>=0?'text-success':'text-danger'}">${month.toFixed(2)}%</td>
    </tr>`;

   document.getElementById("table2").innerHTML += `
    <tr>
     <td>${e.qty}x</td>
     <td>${fmt(invested)} €</td>
     <td>${fmt(value)} €</td>
     <td class="${pl>=0?'text-success':'text-danger'}">${fmt(pl)} €</td>
    </tr>`;

   labels.push(names[e.symbol]);
   dataPie.push(value);

  } catch(err){
   console.error("Fetch error:", e.symbol, err);
  }
 }

 document.getElementById("portfolio-value").innerText = fmt(total) + " €";

 new Chart(document.getElementById("portfolio-piechart"),{
  type:"pie",
  data:{ labels, datasets:[ { data:dataPie } ] },
  plugins:[ChartDataLabels]
 });
}

updatePortfolio();
</script>
</body>
</html>
